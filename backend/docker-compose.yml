# Thoth production compose: Timescale+PostGIS DB, one-shot migrate + seed,
# API + worker + Next.js app. Secrets via env only (see .env.example).
# First boot: docker compose up -d --build
#
# Exposure model: only the app (:3000) is meant to face users/tunnels. The
# browser talks same-origin to the app, which proxies /api to the api service
# on the internal network and injects API_WRITE_KEY server-side. The API port
# binds to localhost for host cron + debugging only.
#
# Behind a shared reverse proxy (docs/HOSTING.md §6): the proxy joins the
# `thoth_edge` network, which holds the app and nothing else — it can reach
# thoth-app-1:3000 but not the API or the database.

name: thoth

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

x-db-url: &db-url postgres://${POSTGRES_USER:-thoth}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-thoth}

services:
  db:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-thoth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-thoth}
    volumes:
      - thoth_pg:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-thoth} -d ${POSTGRES_DB:-thoth}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *logging

  migrate:
    build: .
    command: ["node", "dist/scripts/migrate.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: *db-url
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

  seed:
    build: .
    command: ["node", "dist/scripts/seed-statics.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: *db-url
    depends_on:
      migrate:
        condition: service_completed_successfully
    logging: *logging

  api:
    build: .
    command: ["node", "dist/api/server.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: *db-url
      PORT: "4000"
      API_WRITE_KEY: ${API_WRITE_KEY:?set API_WRITE_KEY (openssl rand -hex 32)}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      TRUST_PROXY: ${TRUST_PROXY:-loopback, linklocal, uniquelocal}
      REQUESTS_PER_MIN: ${REQUESTS_PER_MIN:-300}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    ports:
      - "127.0.0.1:${API_PORT:-4000}:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
    logging: *logging

  worker:
    build: .
    command: ["node", "dist/workers/run.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: *db-url
      POLL_JITTER_PCT: ${POLL_JITTER_PCT:-10}
      TELEGRAM_CHANNELS: ${TELEGRAM_CHANNELS:-osintdefender,war_monitor,aljazeeraenglish}
      OTX_API_KEY: ${OTX_API_KEY:-}
      FINNHUB_KEY: ${FINNHUB_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      migrate:
        condition: service_completed_successfully
    # The image's HEALTHCHECK probes the API on :4000, which this process
    # never serves, so it could only ever report unhealthy. Worker liveness
    # is its DB heartbeat instead (Monitor tab: WORKER DOWN after 60s).
    healthcheck:
      disable: true
    restart: unless-stopped
    # Worker drains in-flight collectors for up to 25s on SIGTERM.
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    logging: *logging

  app:
    build:
      context: ../app
      args:
        # Same-origin: browser → app → (rewrite) → api on the compose network.
        NEXT_PUBLIC_THOTH_API: ""
        THOTH_API_INTERNAL: http://api:4000
    environment:
      API_WRITE_KEY: ${API_WRITE_KEY:?set API_WRITE_KEY (openssl rand -hex 32)}
      # Access gate (src/proxy.ts). Set one of these, or the app is open to
      # anyone who reaches it and writes from the UI are refused (fail closed).
      APP_ACCESS_KEY: ${APP_ACCESS_KEY:-}
      APP_TOKENS: ${APP_TOKENS:-}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-}
      APP_SESSION_TTL_MS: ${APP_SESSION_TTL_MS:-}
      APP_TRUST_UPSTREAM_AUTH: ${APP_TRUST_UPSTREAM_AUTH:-}
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"
    networks:
      - default
      - edge
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
    logging: *logging

networks:
  edge:
    name: thoth_edge

volumes:
  thoth_pg:
