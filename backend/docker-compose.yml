# Thoth production compose: Timescale+PostGIS DB, one-shot migrate, API + worker + Next.js app.
# Secrets via env only (see .env.example). First boot: docker compose up -d --build
services:
  db:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-thoth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-thoth}
    volumes:
      - thoth_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-thoth}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migrate:
    build: .
    command: ["npm", "run", "db:migrate"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-thoth}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-thoth}
    depends_on:
      db:
        condition: service_healthy

  seed:
    build: .
    command: ["node", "dist/scripts/seed-statics.js"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-thoth}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-thoth}
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build: .
    command: ["node", "dist/api/server.js"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-thoth}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-thoth}
      PORT: "4000"
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      REQUESTS_PER_MIN: ${REQUESTS_PER_MIN:-120}
    ports:
      - "${OSIRIS_PORT:-4000}:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  worker:
    build: .
    command: ["node", "dist/workers/run.js"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-thoth}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-thoth}
      POLL_JITTER_PCT: ${POLL_JITTER_PCT:-10}
      TELEGRAM_CHANNELS: ${TELEGRAM_CHANNELS:-osintdefender,war_monitor,aljazeeraenglish}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  app:
    build:
      context: ../app
      args:
        NEXT_PUBLIC_THOTH_API: ${THOTH_API_PUBLIC:-http://localhost:4000}
    environment:
      NEXT_PUBLIC_THOTH_API: ${THOTH_API_PUBLIC:-http://localhost:4000}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G

volumes:
  thoth_pg:
